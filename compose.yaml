services:
  nextjs-dev:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: nextjs-dev
    restart: unless-stopped
    init: true
    ports:
      - "3000:3000"
    volumes:
      - .:/app
      - /app/node_modules
      - /app/.next
    environment:
      - NODE_ENV=development
      - MODEL_RUNNER_HOST=http://model-runner.docker.internal
      - MODEL_RUNNER_PORT=12434
    networks:
      - appnet

networks:
  appnet:
    driver: bridge
